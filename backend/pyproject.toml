[project]
name = "backend"
version = "0.1.0"
description = "Synoras AI backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "celery[redis]>=5.7.0",
    "fastapi[standard]>=0.163.1",
    "httpx>=0.28.1",
    "langchain>=1.5.0",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.8.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.22",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.8",
]

[tool.pytest.ini_options]
# Lets tests write "from app.main import app" (backend/ is the import root).
pythonpath = ["."]
# Silences a pytest-asyncio warning; we will use async tests later.
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
